# jqwik.properties was silently ignored since jqwik 1.6+; this is the file
# it actually reads now. 1000 default trials was mostly re-paying the same
# RSA-2048 keygen cost (see aliases() pool comment, now fixed); with that
# gone each trial is cheap crypto on an already-cached key, so this is pure
# iteration-count overhead. 120 stays above the largest edge-case set (104)
# so every edge case still gets tried, plus real random coverage on top.
jqwik.tries.default=120
